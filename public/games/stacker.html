<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Tower Stacker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #wrap {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 3/4;
      background: #0d1527;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      border: 1px solid #1e293b;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: absolute;
      top: 14px;
      left: 16px;
      font-size: 20px;
      font-weight: 900;
      color: #38bdf8;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #38bdf8;
      color: #090d16;
      border: none;
      padding: 10px 24px;
      border-radius: 99px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div class="hud">STACK: <span id="score">0</span></div>
    <canvas id="game" width="360" height="480"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="title" style="color: #38bdf8; font-size: 26px;">TOWER STACKER</h2>
      <p id="sub" style="color: #94a3b8;">Click or Tap Space to Drop Block</p>
      <button id="start-btn" class="btn">START STACKING</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const subEl = document.getElementById('sub');
    const startBtn = document.getElementById('start-btn');

    const BLOCK_HEIGHT = 20;
    let stack = [];
    let current = null;
    let dir = 1;
    let speed = 3;
    let score = 0;
    let isRunning = false;
    let cameraY = 0;

    function start() {
      score = 0;
      speed = 3;
      scoreEl.textContent = '0';
      stack = [{ x: 80, y: canvas.height - BLOCK_HEIGHT, w: 200, color: '#38bdf8' }];
      spawnNext();
      overlay.classList.add('hidden');
      isRunning = true;
      loop();
    }

    function spawnNext() {
      const top = stack[stack.length - 1];
      const hue = (stack.length * 25) % 360;
      current = {
        x: 0,
        y: top.y - BLOCK_HEIGHT,
        w: top.w,
        color: `hsl(${hue}, 85%, 60%)`
      };
      dir = 1;
      speed = 3 + Math.min(stack.length * 0.15, 6);
    }

    function place() {
      if (!isRunning || !current) return;
      const top = stack[stack.length - 1];
      const diff = current.x - top.x;

      if (Math.abs(diff) < 4) {
        // Perfect match bonus
        current.x = top.x;
      } else if (Math.abs(diff) >= current.w) {
        // Missed completely
        gameOver();
        return;
      } else {
        // Sliced block
        if (diff > 0) {
          current.w -= diff;
        } else {
          current.w += diff;
          current.x = top.x;
        }
      }

      stack.push({ ...current });
      score++;
      scoreEl.textContent = score;

      if (current.y < canvas.height / 2) {
        cameraY += BLOCK_HEIGHT;
      }

      spawnNext();
    }

    function gameOver() {
      isRunning = false;
      titleEl.textContent = "TOWER COLLAPSED";
      titleEl.style.color = "#ef4444";
      subEl.textContent = `Score: ${score} Blocks`;
      startBtn.textContent = "PLAY AGAIN";
      overlay.classList.remove('hidden');
    }

    function loop() {
      if (!isRunning) return;

      current.x += dir * speed;
      if (current.x + current.w >= canvas.width) {
        current.x = canvas.width - current.w;
        dir = -1;
      } else if (current.x <= 0) {
        current.x = 0;
        dir = 1;
      }

      draw();
      requestAnimationFrame(loop);
    }

    function draw() {
      ctx.fillStyle = '#0d1527';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(0, cameraY);

      // Stack
      stack.forEach(b => {
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, BLOCK_HEIGHT);
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        ctx.fillRect(b.x, b.y, b.w, 3);
      });

      // Current Block
      if (current) {
        ctx.fillStyle = current.color;
        ctx.fillRect(current.x, current.y, current.w, BLOCK_HEIGHT);
        ctx.fillStyle = 'rgba(255,255,255,0.3)';
        ctx.fillRect(current.x, current.y, current.w, 3);
      }

      ctx.restore();
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (!isRunning) start();
        else place();
      }
    });

    canvas.addEventListener('pointerdown', () => {
      if (!isRunning) start();
      else place();
    });

    startBtn.onclick = start;
    draw();
  </script>
</body>
</html>
