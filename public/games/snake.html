<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon Snake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 480px;
      padding: 12px 16px;
      background: #131b2e;
      border-radius: 12px 12px 0 0;
      border: 1px solid #1e293b;
      font-size: 14px;
      font-weight: 600;
    }
    .val { color: #10b981; font-size: 18px; font-weight: 700; }
    .best { color: #f59e0b; }
    #canvas-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      background: #0b1120;
      border: 1px solid #1e293b;
      border-top: none;
      border-bottom: none;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1/1;
      background: #0b1329;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 480px;
      padding: 12px;
      background: #131b2e;
      border-radius: 0 0 12px 12px;
      border: 1px solid #1e293b;
    }
    .btn {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s;
    }
    .btn:active { background: #10b981; transform: scale(0.96); }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .start-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>
<body>
  <div class="header">
    <div>SCORE: <span id="score" class="val">0</span></div>
    <div>BEST: <span id="best" class="val best">0</span></div>
    <div>LEVEL: <span id="level" class="val" style="color: #60a5fa">1</span></div>
  </div>

  <div id="canvas-container">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlay-title" style="font-size: 24px; color: #10b981;">NEON SNAKE</h2>
      <p id="overlay-msg" style="color: #94a3b8; font-size: 14px;">Use Arrow Keys / WASD or D-Pad</p>
      <button id="start-btn" class="start-btn">PLAY GAME</button>
    </div>
  </div>

  <div class="controls">
    <div></div>
    <button class="btn" onclick="setDir(0, -1)">▲</button>
    <div></div>
    <button class="btn" onclick="setDir(-1, 0)">◀</button>
    <button class="btn" onclick="togglePause()">⏯</button>
    <button class="btn" onclick="setDir(1, 0)">▶</button>
    <div></div>
    <button class="btn" onclick="setDir(0, 1)">▼</button>
    <div></div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const levelEl = document.getElementById('level');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayMsg = document.getElementById('overlay-msg');
    const startBtn = document.getElementById('start-btn');

    const GRID_SIZE = 20;
    const TILE_COUNT = 20;
    let snake = [{x: 10, y: 10}];
    let food = {x: 5, y: 5, type: 'normal'};
    let dx = 0;
    let dy = 0;
    let nextDx = 0;
    let nextDy = 0;
    let score = 0;
    let best = parseInt(localStorage.getItem('snake_best') || '0');
    bestEl.textContent = best;
    let gameLoop = null;
    let isRunning = false;
    let isPaused = false;
    let speed = 120;
    let particles = [];

    // Simple Synth Sound
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function beep(freq, type = 'sine', dur = 0.08) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + dur);
      } catch(e) {}
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * TILE_COUNT);
        food.y = Math.floor(Math.random() * TILE_COUNT);
        valid = !snake.some(seg => seg.x === food.x && seg.y === food.y);
      }
      food.type = Math.random() > 0.85 ? 'golden' : 'normal';
    }

    function startGame() {
      snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
      dx = 0;
      dy = -1;
      nextDx = 0;
      nextDy = -1;
      score = 0;
      speed = 120;
      scoreEl.textContent = '0';
      levelEl.textContent = '1';
      particles = [];
      spawnFood();
      overlay.classList.add('hidden');
      isRunning = true;
      isPaused = false;
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, speed);
      beep(440, 'triangle', 0.1);
    }

    function gameOver() {
      isRunning = false;
      clearInterval(gameLoop);
      beep(150, 'sawtooth', 0.3);
      if (score > best) {
        best = score;
        localStorage.setItem('snake_best', best);
        bestEl.textContent = best;
      }
      overlayTitle.textContent = "GAME OVER";
      overlayTitle.style.color = "#ef4444";
      overlayMsg.textContent = `Score: ${score} | High Score: ${best}`;
      startBtn.textContent = "PLAY AGAIN";
      overlay.classList.remove('hidden');
    }

    function togglePause() {
      if (!isRunning) return;
      isPaused = !isPaused;
      if (isPaused) {
        clearInterval(gameLoop);
        overlayTitle.textContent = "PAUSED";
        overlayTitle.style.color = "#fbbf24";
        overlayMsg.textContent = "Press Play or Space to resume";
        startBtn.textContent = "RESUME";
        overlay.classList.remove('hidden');
      } else {
        overlay.classList.add('hidden');
        gameLoop = setInterval(update, speed);
      }
    }

    function setDir(nx, ny) {
      if (!isRunning && overlay.classList.contains('hidden')) return;
      if (isRunning && (nx !== -dx || snake.length === 1) && (ny !== -dy || snake.length === 1)) {
        nextDx = nx;
        nextDy = ny;
      }
    }

    window.addEventListener('keydown', e => {
      if (["ArrowUp", "KeyW"].includes(e.code)) { e.preventDefault(); setDir(0, -1); }
      else if (["ArrowDown", "KeyS"].includes(e.code)) { e.preventDefault(); setDir(0, 1); }
      else if (["ArrowLeft", "KeyA"].includes(e.code)) { e.preventDefault(); setDir(-1, 0); }
      else if (["ArrowRight", "KeyD"].includes(e.code)) { e.preventDefault(); setDir(1, 0); }
      else if (e.code === "Space") {
        e.preventDefault();
        if (!isRunning) startGame();
        else togglePause();
      }
    });

    startBtn.onclick = () => {
      if (isPaused) togglePause();
      else startGame();
    };

    function update() {
      dx = nextDx;
      dy = nextDy;
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};

      // Wall wrap or collision
      if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Eat Food
      if (head.x === food.x && head.y === food.y) {
        const pts = food.type === 'golden' ? 50 : 10;
        score += pts;
        scoreEl.textContent = score;
        beep(food.type === 'golden' ? 880 : 587, 'sine', 0.1);
        
        // Spawn particles
        for(let i=0; i<12; i++) {
          particles.push({
            x: food.x * GRID_SIZE + 10,
            y: food.y * GRID_SIZE + 10,
            vx: (Math.random() - 0.5) * 4,
            vy: (Math.random() - 0.5) * 4,
            life: 1,
            color: food.type === 'golden' ? '#fbbf24' : '#10b981'
          });
        }

        const currentLvl = Math.floor(score / 100) + 1;
        levelEl.textContent = currentLvl;
        if (speed > 60) {
          speed = Math.max(60, 120 - currentLvl * 6);
          clearInterval(gameLoop);
          gameLoop = setInterval(update, speed);
        }

        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      ctx.fillStyle = '#070b14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Grid Lines
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= TILE_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * GRID_SIZE, 0);
        ctx.lineTo(i * GRID_SIZE, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * GRID_SIZE);
        ctx.lineTo(canvas.width, i * GRID_SIZE);
        ctx.stroke();
      }

      // Food
      ctx.shadowBlur = 10;
      ctx.shadowColor = food.type === 'golden' ? '#fbbf24' : '#10b981';
      ctx.fillStyle = food.type === 'golden' ? '#fbbf24' : '#10b981';
      ctx.beginPath();
      ctx.arc(food.x * GRID_SIZE + 10, food.y * GRID_SIZE + 10, food.type === 'golden' ? 8 : 7, 0, Math.PI * 2);
      ctx.fill();

      // Snake Body
      snake.forEach((seg, i) => {
        const isHead = i === 0;
        ctx.shadowBlur = isHead ? 12 : 6;
        ctx.shadowColor = isHead ? '#34d399' : '#059669';
        ctx.fillStyle = isHead ? '#34d399' : `hsl(${155 - i * 2}, 80%, ${Math.max(35, 55 - i)}%)`;
        ctx.fillRect(seg.x * GRID_SIZE + 1.5, seg.y * GRID_SIZE + 1.5, GRID_SIZE - 3, GRID_SIZE - 3);

        if (isHead) {
          ctx.fillStyle = '#000';
          ctx.shadowBlur = 0;
          ctx.beginPath();
          ctx.arc(seg.x * GRID_SIZE + 6, seg.y * GRID_SIZE + 6, 2, 0, Math.PI * 2);
          ctx.arc(seg.x * GRID_SIZE + 14, seg.y * GRID_SIZE + 6, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      });

      // Particles
      ctx.shadowBlur = 0;
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.life;
        ctx.fillRect(p.x, p.y, 3, 3);
        ctx.globalAlpha = 1;
      }
    }

    draw();
  </script>
</body>
</html>
