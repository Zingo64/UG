<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Flappy Pixel Bird</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #0f172a;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 4/5;
      background: #38bdf8;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border: 2px solid #1e293b;
    }
    canvas { display: block; width: 100%; height: 100%; }
    .score-hud {
      position: absolute;
      top: 20px;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 42px;
      font-weight: 900;
      text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
      pointer-events: none;
      z-index: 10;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 20;
    }
    .overlay.hidden { display: none; }
    .btn {
      background: #f59e0b;
      color: #0f172a;
      border: none;
      padding: 12px 28px;
      border-radius: 99px;
      font-weight: 800;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="score" class="score-hud">0</div>
    <canvas id="game" width="360" height="480"></canvas>
    <div id="overlay" class="overlay">
      <h1 id="title" style="color: #f59e0b; font-size: 32px;">FLAPPY BIRD</h1>
      <p id="sub" style="color: #cbd5e1; font-size: 15px;">Press Space or Tap to Flap</p>
      <button id="start-btn" class="btn">PLAY</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const overlay = document.getElementById('overlay');
    const titleEl = document.getElementById('title');
    const subEl = document.getElementById('sub');
    const startBtn = document.getElementById('start-btn');

    let bird = { x: 80, y: 200, vy: 0, rad: 14, rot: 0 };
    let pipes = [];
    let frame = 0;
    let score = 0;
    let best = parseInt(localStorage.getItem('flappy_best') || '0');
    let isRunning = false;
    const gravity = 0.38;
    const jump = -6.8;
    const pipeGap = 125;
    const pipeWidth = 52;

    function start() {
      bird = { x: 80, y: 220, vy: 0, rad: 14, rot: 0 };
      pipes = [];
      frame = 0;
      score = 0;
      scoreEl.textContent = '0';
      overlay.classList.add('hidden');
      isRunning = true;
      loop();
    }

    function flap() {
      if (!isRunning) return;
      bird.vy = jump;
    }

    function gameOver() {
      isRunning = false;
      if (score > best) {
        best = score;
        localStorage.setItem('flappy_best', best);
      }
      titleEl.textContent = "GAME OVER";
      titleEl.style.color = "#ef4444";
      subEl.textContent = `Score: ${score} | Best: ${best}`;
      startBtn.textContent = "TRY AGAIN";
      overlay.classList.remove('hidden');
    }

    function loop() {
      if (!isRunning) return;
      frame++;

      // Bird physics
      bird.vy += gravity;
      bird.y += bird.vy;
      bird.rot = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.vy / 10)));

      // Spawn pipes
      if (frame % 90 === 0) {
        const topH = Math.floor(Math.random() * (canvas.height - pipeGap - 140)) + 40;
        pipes.push({ x: canvas.width, top: topH, passed: false });
      }

      // Pipes update
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= 2.2;

        // Check scoring
        if (!p.passed && p.x + pipeWidth < bird.x) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
        }

        // Collision
        if (bird.x + bird.rad > p.x && bird.x - bird.rad < p.x + pipeWidth) {
          if (bird.y - bird.rad < p.top || bird.y + bird.rad > p.top + pipeGap) {
            gameOver();
            return;
          }
        }

        if (p.x + pipeWidth < 0) pipes.splice(i, 1);
      }

      // Floor & ceiling collision
      if (bird.y + bird.rad >= canvas.height - 40 || bird.y - bird.rad <= 0) {
        gameOver();
        return;
      }

      // Draw
      draw();
      requestAnimationFrame(loop);
    }

    function draw() {
      // Sky
      const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      skyGrad.addColorStop(0, '#38bdf8');
      skyGrad.addColorStop(1, '#bae6fd');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.beginPath();
      ctx.arc(80 + (frame * 0.2) % 400, 70, 24, 0, Math.PI * 2);
      ctx.arc(100 + (frame * 0.2) % 400, 60, 30, 0, Math.PI * 2);
      ctx.arc(130 + (frame * 0.2) % 400, 70, 24, 0, Math.PI * 2);
      ctx.fill();

      // Pipes
      pipes.forEach(p => {
        // Top pipe
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, 0, pipeWidth, p.top);
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(p.x - 4, p.top - 20, pipeWidth + 8, 20);

        // Bottom pipe
        const botY = p.top + pipeGap;
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, botY, pipeWidth, canvas.height - botY - 40);
        ctx.fillStyle = '#16a34a';
        ctx.fillRect(p.x - 4, botY, pipeWidth + 8, 20);
      });

      // Ground
      ctx.fillStyle = '#eab308';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
      ctx.fillStyle = '#84cc16';
      ctx.fillRect(0, canvas.height - 40, canvas.width, 8);

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rot);
      
      // Body
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(0, 0, bird.rad, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ca8a04';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(6, -4, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(8, -4, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(18, 4);
      ctx.lineTo(10, 8);
      ctx.closePath();
      ctx.fill();

      // Wing
      ctx.fillStyle = '#eab308';
      ctx.beginPath();
      ctx.ellipse(-4, 3, 7, 4, Math.sin(frame * 0.3) * 0.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    startBtn.onclick = start;
    window.addEventListener('keydown', e => {
      if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) {
        e.preventDefault();
        if (!isRunning) start();
        else flap();
      }
    });
    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      if (!isRunning) start();
      else flap();
    });
    draw();
  </script>
</body>
</html>
